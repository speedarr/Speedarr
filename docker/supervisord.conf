[supervisord]
nodaemon=true
pidfile=/tmp/supervisord.pid
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info

[program:speedarr-backend]
command=uvicorn app.main:app --host 0.0.0.0 --port 9494
directory=/app
user=speedarr
autostart=true
autorestart=true
startretries=3
startsecs=5
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=DATABASE_URL="sqlite+aiosqlite:////data/speedarr.db"

[eventlistener:fatal-exit]
; Stops supervisord (PID 1) when the backend goes FATAL so the container exits and Docker's
; restart policy can act (audit I1-2). stdout is the listener protocol; logging goes to stderr.
command=python3 /usr/local/bin/speedarr-fatal-exit.py
events=PROCESS_STATE_FATAL
autostart=true
autorestart=unexpected
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
