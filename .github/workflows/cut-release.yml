name: Cut Release

# Cuts a release when a PR titled "Release vYYYY.MM.DD" (or ".N") merges into main:
# tags the merge commit, triggers the release build, and syncs develop.
# Manual dispatch remains for hotfixes and same-day re-releases.

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (vYYYY.MM.DD or vYYYY.MM.DD.N). Leave empty to use today's UTC date."
        required: false
        default: ""
      dry_run:
        description: "Resolve and validate the version only; do not tag, build or sync."
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  actions: write

jobs:
  cut-release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true && startsWith(github.event.pull_request.title, 'Release v'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Determine version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            VERSION=$(printf '%s' "${PR_TITLE#Release }" | tr -d '[:space:]')
            TARGET="$PR_MERGE_SHA"
          else
            VERSION=$(printf '%s' "$INPUT_VERSION" | tr -d '[:space:]')
            [ -n "$VERSION" ] || VERSION="v$(date -u +%Y.%m.%d)"
            TARGET="$(git rev-parse HEAD)"
          fi
          if ! echo "$VERSION" | grep -qE '^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$'; then
            echo "::error::Version '$VERSION' does not match vYYYY.MM.DD or vYYYY.MM.DD.N"
            exit 1
          fi
          if git rev-parse "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag $VERSION already exists. For a same-day re-release, dispatch with e.g. $VERSION.1."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$TARGET" HEAD; then
            echo "::error::Commit $TARGET is not on main"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Cutting $VERSION at $TARGET"

      - name: Create and push tag
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TARGET: ${{ steps.version.outputs.target }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" "$TARGET" -m "Release $VERSION"
          git push origin "$VERSION"

      - name: Trigger release build
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Tags pushed with GITHUB_TOKEN do not fire on:push workflows
          # (GitHub anti-recursion), so dispatch the release workflow explicitly.
          gh workflow run release.yml --ref "$VERSION" --repo "$GITHUB_REPOSITORY"

      - name: Sync develop with main
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git checkout develop
          if ! git merge main -m "chore: sync develop with main after $VERSION"; then
            echo "::error::Merge conflict syncing develop with main. Sync manually: git checkout develop && git merge main && git push"
            exit 1
          fi
          git push origin develop
